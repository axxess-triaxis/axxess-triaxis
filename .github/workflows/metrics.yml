name: Metrics

on:
  schedule:
    - cron: "0 17 * * *" # end of day, 22:30 IST
  workflow_dispatch:

permissions:
  contents: write # commit the generated metrics.svg

jobs:
  activity:
    # End of day, only on days the account was active: a push, merge or branch by somebody other than a
    # bot in a public repository in the last 24 hours. Manual runs always go ahead, and so does a failed check.
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/readme-activity.mjs active --owner "$GITHUB_REPOSITORY_OWNER" || echo "active=true" >> "$GITHUB_OUTPUT"

  github-metrics:
    needs: activity
    if: github.event_name != 'schedule' || needs.activity.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Metrics embed
        # lowlighter/metrics v3.34, pinned to the tag's commit.
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          # METRICS_KEY: classic personal access token with repo + read:user scopes,
          # so private repositories and their languages are counted too. Set an
          # expiry and renew it: an expired token fails every run with "Bad credentials".
          token: ${{ secrets.METRICS_KEY }}
          filename: metrics.svg
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          repositories_forks: yes
          plugin_languages: yes
          plugin_isocalendar: yes
