name: Metrics

on:
  schedule:
    - cron: "30 0 * * *" # daily, 06:00 IST
  workflow_dispatch:

permissions:
  contents: write # commit the generated metrics.svg

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Metrics embed
        # lowlighter/metrics v3.34, pinned to the tag's commit.
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_KEY }} # classic personal access token, no scopes (public data only)
          filename: metrics.svg
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_isocalendar: yes
