name: Readme stats

on:
  schedule:
    - cron: "30 17 * * *" # end of day, 23:00 IST, after the Metrics workflow
  workflow_dispatch:

permissions:
  contents: write # commit the generated profile/stats.svg

jobs:
  activity:
    # End of day, only on days the account was active: a push, merge or branch by somebody other than a
    # bot in a public repository in the last 24 hours. Manual runs always go ahead, and so does a failed check.
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/readme-activity.mjs active --owner "$GITHUB_REPOSITORY_OWNER" || echo "active=true" >> "$GITHUB_OUTPUT"

  stats-card:
    needs: activity
    if: github.event_name != 'schedule' || needs.activity.outputs.active == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check token (status and scopes only)
        env:
          TOKEN: ${{ secrets.README_STATS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "README_STATS_TOKEN not set; public data only"; exit 0; fi
          code=$(curl -s -o /dev/null -D headers.txt -w "%{http_code}" -H "Authorization: Bearer $TOKEN" https://api.github.com/user)
          echo "GitHub /user status: $code"
          grep -i -E "^x-oauth-scopes|^github-authentication-token-expiration" headers.txt || echo "No scope header (fine-grained token)"
          rm -f headers.txt

      - name: Generate stats card
        # github-readme-stats-action v2.1.0, pinned to the tag's commit.
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true
          path: profile/stats.svg
          # README_STATS_TOKEN: fine-grained or classic PAT with repo + read:user, so private work counts.
          # Falls back to public data only until that secret exists.
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update readme stats card" || exit 0
          git pull --rebase
          git push
